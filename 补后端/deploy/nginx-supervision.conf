# ==============================================================================
# nginx-supervision.conf - 监理现场管理系统 Nginx 站点配置模板
#
# 使用方法：
#   1. 将本文件中所有 your-domain.com 替换为真实域名
#   2. 将 SSL 证书（fullchain.pem / privkey.pem）放入 /opt/supervision/certs/
#   3. 安装配置：
#        sudo cp nginx-supervision.conf /etc/nginx/conf.d/supervision.conf
#        （Ubuntu 也可放 /etc/nginx/sites-available/ 并软链到 sites-enabled/）
#   4. 校验并重载：
#        sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ---------------- 登录接口频率限制（防暴力破解）----------------
# 定义共享内存区域 login_limit：10MB，每 IP 每分钟最多 10 次请求
# 本指令位于 http 上下文（conf.d/ 文件被 include 到 http 块内），可在 server 块中引用
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# ---------------- HTTP 80：全部 301 跳转到 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    return 301 https://$host$request_uri;
}

# ---------------- HTTPS 443：主站点 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # ---------------- SSL 证书 ----------------
    ssl_certificate     /opt/supervision/certs/fullchain.pem;
    ssl_certificate_key /opt/supervision/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------------- 安全加固 ----------------
    # 隐藏 Nginx 版本号
    server_tokens off;
    # HSTS：一年内强制 HTTPS（确认 HTTPS 稳定后再启用 preload）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 禁止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止被 iframe 嵌套（防点击劫持）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # CSP：前端为纯静态 HTML + 内联样式/脚本，必须允许 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

    # ---------------- gzip 压缩 ----------------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/javascript text/css text/html;
    gzip_vary on;

    # 与后端一致：单文件 50MB / 单请求 100MB
    client_max_body_size 100m;

    # ---------------- 禁止原始附件直出 ----------------
    # 原路径只作存库标识；/api/files/access 签发链接，/api/files/content 再验权限。
    # 上传目录必须位于静态站点根目录之外，禁止另配 alias 暴露资料。
    location ^~ /api/uploads/ {
        # 原始存库路径不再公开访问，前端通过 /api/files/access 换取受控链接。
        return 403;
        add_header Cache-Control "private, no-store" always;
        # 上传目录禁止执行任何脚本类内容，仅作静态下载
        add_header X-Content-Type-Options "nosniff" always;

    }

    location ^~ /uploads/ { return 403; }

    # ---------------- 登录接口限频（精确匹配优先于下方 ^~ /api/）----------------
    # 防暴力破解：每 IP 每分钟最多 10 次登录请求，允许突发排队 5 个
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ---------------- 后端 API 反向代理 ----------------
    # 后端 Spring Boot 监听 127.0.0.1:8080，context-path 为 /api
    # 同样使用 ^~ 避免被正则 location 抢占（/api/uploads/ 因前缀更长优先于本条）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/导出报表可能耗时较长
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---------------- 前端静态站点 ----------------
    root /opt/supervision/static;
    index login.html index.html;

    # HTML 页面不缓存，保证发版后用户立即拿到新页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 脚本未使用内容哈希文件名，强制重新验证，防止新后端配到旧版写入协议。
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # 非业务静态图片和字体缓存 30 天
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
