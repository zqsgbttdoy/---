# ==============================================================================
# 默认（开发）环境配置：零环境变量即可启动。
# 生产环境请设置 SPRING_PROFILES_ACTIVE=prod，由 application-prod.yml 覆盖敏感配置。
# ==============================================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # ---------------- 数据源配置（仅开发环境，生产由 application-prod.yml 覆盖）----------------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/supervision_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 开发默认账号；生产环境必须通过环境变量注入（见 application-prod.yml）
    username: root
    password: root
    druid:
      # 开发连接池参数（生产参数由 application-prod.yml 覆盖）
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ---------------- JPA / Hibernate 配置（仅开发环境，生产由 application-prod.yml 覆盖）----------------
  jpa:
    hibernate:
      # 仅开发环境自动更新表结构；生产为 validate
      ddl-auto: update
    # 仅开发环境打印 SQL；生产关闭
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: false
        # JDBC 批处理：配合 saveAll 将多条 INSERT/UPDATE 合并批量提交，提升批量写入性能
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ---------------- Jackson 序列化配置（开发/生产通用）----------------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ---------------- 文件上传大小限制（开发/生产通用）----------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# ---------------- 日志级别（仅开发环境 debug，生产由 application-prod.yml 覆盖为 info/warn）----------------
logging:
  level:
    com.supervision: debug
    org.hibernate.SQL: debug

# 应用自定义配置
app:
  jwt:
    # 仅开发环境默认密钥；生产环境必须通过环境变量 APP_JWT_SECRET 覆盖（至少 32 个字符）
    secret: ${APP_JWT_SECRET:supervision-site-management-default-secret-key-please-change-in-production-2026}
    # 令牌有效期（毫秒），默认 24 小时
    expiration: ${APP_JWT_EXPIRATION:86400000}
  cors:
    # 允许跨域来源（逗号分隔）：仅开发环境默认放开全部；生产由 application-prod.yml 强制限定为明确域名
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  security:
    # 管理员重置用户密码时的默认密码：仅开发环境默认 123456；生产由 application-prod.yml 强制要求环境变量注入
    default-reset-password: ${APP_DEFAULT_RESET_PASSWORD:123456}
  upload:
    # 上传文件物理根目录（相对路径将按绝对路径处理），可通过环境变量 APP_UPLOAD_DIR 覆盖
    dir: ${APP_UPLOAD_DIR:uploads}
    # 允许上传的扩展名白名单（逗号分隔），可通过环境变量 APP_UPLOAD_ALLOWED_EXTENSIONS 覆盖
    allowed-extensions: ${APP_UPLOAD_ALLOWED_EXTENSIONS:jpg,jpeg,png,gif,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar}
